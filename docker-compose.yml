version: '3.8'

services:
  # Server A: MySQL Database (completely isolated)
  mysql:
    image: mysql:8.0
    container_name: sales_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sales_manager
      MYSQL_USER: sales_user
      MYSQL_PASSWORD: sales_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - database_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: sales_manager_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
    networks:
      - backend_network

  # Server B: Data Layer Service (has database access)
  data-layer:
    build:
      context: ./data-layer
      dockerfile: Dockerfile
    container_name: sales_manager_data_layer
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=sales_user
      - DB_PASSWORD=sales_password
      - DB_NAME=sales_manager
      - SERVICE_TYPE=data-layer
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - database_network
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 20s
      retries: 10

  # Server C: Backend API Gateway (communicates with Data Layer)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: sales_manager_backend
    restart: unless-stopped
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=your-super-secret-key-for-development-only-change-in-production
      - IS_DEVELOPMENT=true
      - DATA_LAYER_URL=http://data-layer:8000
      - SERVICE_TYPE=backend
    ports:
      - "8000:8000"
    depends_on:
      data-layer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 20s
      retries: 10

  # Mock Client Finance API (Tally-like)
  mock-client-api:
    image: python:3.11-slim
    container_name: sales_manager_mock_client_api
    restart: unless-stopped
    ports:
      - "8002:8000"
    working_dir: /app
    volumes:
      - ./mock_client_api:/app
    command: >
      sh -c "pip install fastapi uvicorn &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - backend_network

volumes:
  mysql_data:
  redis_data:

networks:
  database_network:
    name: sales_manager_database_network
    driver: bridge
  backend_network:
    name: sales_manager_backend_network
    driver: bridge
