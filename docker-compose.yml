services:
  # Server A: MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sales_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sales_manager
      MYSQL_USER: sales_user
      MYSQL_PASSWORD: sales_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # REMOVED the file mount here to prevent the "directory" conflict
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - database_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sales_manager_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
    networks:
      - backend_network

  # Server B: Data Layer
  data-layer:
    build:
      context: ./data-layer
      dockerfile: Dockerfile
    container_name: sales_manager_data_layer
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=sales_user
      - DB_PASSWORD=sales_password
      - DB_NAME=sales_manager
      - SERVICE_TYPE=data-layer
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - database_network
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 20s
      retries: 10
    develop:
      watch:
        - action: sync
          path: ./data-layer
          target: /app
          ignore:
            - __pycache__/
            - .pyc
            - .git/
        - action: rebuild
          path: ./data-layer/requirements.txt

  # Server C: Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_manager_backend
    restart: unless-stopped
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=your-super-secret-key-for-development-only-change-in-production
      - IS_DEVELOPMENT=true
      - DATA_LAYER_URL=http://data-layer:8000
      - SERVICE_TYPE=backend
    ports:
      - "8000:8000"
    depends_on:
      data-layer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 20s
      retries: 10
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - .pyc
            - .git/
        - action: rebuild
          path: ./backend/requirements.txt

  # Mock Client API
  mock-client-api:
    image: python:3.11-slim
    container_name: sales_manager_mock_client_api
    restart: unless-stopped
    ports:
      - "8002:8000"
    working_dir: /app
    volumes:
      - ./mock_client_api:/app
    command: >
      sh -c "pip install fastapi uvicorn &&
             python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - backend_network

  # Database Seeding Service
  db-seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile.seeder
    container_name: sales_manager_seeder
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    command: >
      bash -c "
        echo '🌱 Starting database seeding process...' &&
        
        echo '⏳ Waiting for database to be ready...' &&
        until mysql -h mysql -P 3306 -u sales_user -psales_password -e 'SELECT 1' > /dev/null 2>&1; do
          echo 'Database is unavailable - sleeping' &&
          sleep 2
        done &&
        echo '✅ Database is ready!' &&
        
        echo '📁 Ensuring database exists...' &&
        mysql -h mysql -P 3306 -u sales_user -psales_password -e 'CREATE DATABASE IF NOT EXISTS sales_manager;' &&
        
        # ✅ NEW STEP: Run init.sql first to create all tables!
        echo '🏗️ Creating database structure (Tables)...' &&
        mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager < /seed_data/init.sql &&

        echo '👥 Seeding users...' &&
        mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager < /seed_data/simplified_dummy_data.sql &&
        
        echo '🏪 Seeding shops...' &&
        mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager < /seed_data/simplified_shops_data.sql &&
        
        echo '👥 Seeding assignments...' &&
        mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager < /seed_data/simplified_assignments.sql &&
        
        echo '📊 Seeding synced data...' &&
        mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager < /seed_data/simplified_synced_data.sql &&
        
        echo '🔍 Verifying data insertion...' &&
        TENANT_COUNT=$$(mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager -s -N -e 'SELECT COUNT(*) FROM tenants;') &&
        USER_COUNT=$$(mysql -h mysql -P 3306 -u sales_user -psales_password sales_manager -s -N -e 'SELECT COUNT(*) FROM users;') &&
        
        echo '📈 Database seeding completed successfully!' &&
        echo '   - Tenants: '\$$TENANT_COUNT &&
        echo '   - Users:   '\$$USER_COUNT
      "
    networks:
      - database_network
    profiles:
      - seed
volumes:
  mysql_data:
  redis_data:

networks:
  database_network:
    name: sales_manager_database_network
    driver: bridge
  backend_network:
    name: sales_manager_backend_network
    driver: bridge
